<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cartel de calle · Veterinaria Mi Fiel Amigo</title>
<link rel="icon" href="img/logo.png" />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
<style id="pagesize">@page{ size:A4; margin:0; }</style>
<style>
  :root{
    --azul:#0060A8;
    --azul-oscuro:#004f86;
    --verde:#78C018;
    --carbon:#2B2B2B;
    --crema:#FBF6EE;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:'Nunito',sans-serif; color:var(--carbon); background:#d9dde1; }

  .toolbar{
    position:sticky; top:0; z-index:10; background:var(--carbon); color:#fff;
    padding:12px 18px; display:flex; align-items:center; justify-content:center;
    gap:10px; font-size:14px; flex-wrap:wrap;
  }
  .toolbar button{
    background:var(--azul); color:#fff; border:none; padding:10px 20px; border-radius:24px;
    font-weight:700; font-size:14px; cursor:pointer; font-family:'Nunito',sans-serif;
    display:inline-flex; align-items:center; gap:8px;
  }
  .toolbar button.ghost{ background:transparent; border:1.5px solid rgba(255,255,255,0.35); }
  .toolbar span{ opacity:0.7; font-size:12.5px; }

  /* Lienzo A4; con .a3 escala todo x1.414 para imprimir en A3 */
  .poster{
    width:210mm; height:297mm; margin:18px auto; background:var(--crema);
    box-shadow:0 6px 24px rgba(0,0,0,0.18);
    padding:16mm 14mm 12mm;
    display:flex; flex-direction:column; align-items:center; text-align:center;
    position:relative; overflow:hidden;
  }
  body.a3 .poster{ width:297mm; height:420mm; padding:23mm 20mm 17mm; }
  body.a3 .poster > *{ zoom:1.414; }

  .franja{
    position:absolute; left:0; right:0; top:0; height:9mm;
    background:linear-gradient(90deg, var(--azul) 0 50%, var(--verde) 50% 100%);
  }

  .marca{ display:flex; align-items:center; justify-content:center; gap:12px; margin-top:4mm; }
  .marca img{ width:26mm; height:26mm; object-fit:contain; }
  .marca-txt{ text-align:left; }
  .marca-txt b{
    display:block; font-family:'Baloo 2',cursive; font-size:34px; line-height:1.05;
    color:var(--carbon); font-weight:700;
  }
  .marca-txt span{
    display:block; font-size:14px; font-weight:800; letter-spacing:4px;
    text-transform:uppercase; color:var(--azul);
  }

  .titulo{
    font-family:'Baloo 2',cursive; font-size:76px; line-height:1; font-weight:800;
    color:var(--azul); margin:8mm 0 2mm;
  }
  .con-quien{ font-size:26px; font-weight:800; color:var(--carbon); margin-bottom:9mm; }

  .qr-box{ background:#fff; border-radius:18px; padding:6mm; box-shadow:0 8px 24px rgba(0,0,0,0.10); }
  .qr-box img{ width:88mm; height:88mm; display:block; }
  .qr-pie{ font-size:19px; font-weight:700; color:#6f6a60; margin-top:5mm; }
  .url{ font-family:'Baloo 2',cursive; font-size:30px; font-weight:700; color:var(--carbon); margin-top:1mm; }

  .dias{
    width:100%; background:var(--azul); color:#fff; border-radius:16px;
    padding:6mm 6mm 7mm; margin-top:9mm;
  }
  .dias-rot{
    font-size:15px; font-weight:800; letter-spacing:3px; text-transform:uppercase;
    opacity:0.85; margin-bottom:2mm;
  }
  .dias-val{ font-family:'Baloo 2',cursive; font-size:44px; font-weight:700; line-height:1.05; }
  .dias-hora{ font-size:30px; font-weight:800; margin-top:1mm; }

  .pie{ margin-top:auto; padding-top:6mm; width:100%; }
  .direccion{ font-size:17px; font-weight:700; color:var(--carbon); }
  .direccion span{ color:#8a8478; font-weight:600; }

  @media print{
    body{ background:#fff; }
    .toolbar{ display:none; }
    .poster{ margin:0; box-shadow:none; }
  }
  @media (max-width:760px){
    .poster{ width:100%; height:auto; padding:10mm 7mm; }
    body.a3 .poster{ width:100%; height:auto; }
    body.a3 .poster > *{ zoom:1; }
    .titulo{ font-size:52px; }
    .qr-box img{ width:70mm; height:70mm; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <button onclick="imprimir('A4')"><i class="ti ti-printer"></i> Imprimir A4</button>
  <button class="ghost" onclick="imprimir('A3')"><i class="ti ti-printer"></i> Imprimir A3</button>
  <span>Para la vidriera: A3 se lee mejor desde la vereda</span>
</div>

<div class="poster">
  <div class="franja"></div>

  <div class="marca">
    <img src="img/logo.png" alt="Logo Veterinaria Mi Fiel Amigo" />
    <div class="marca-txt">
      <b>Mi Fiel Amigo</b>
      <span>Veterinaria</span>
    </div>
  </div>

  <div class="titulo">Pedí tu turno</div>
  <div class="con-quien">con el Vet. Octavio Ochoa</div>

  <div class="qr-box">
    <img src="img/qr-turnos.png" alt="Código QR para pedir turno" />
  </div>
  <div class="qr-pie">Escaneá con la cámara del celular</div>
  <div class="url">mifielamigo.web.app</div>

  <div class="dias">
    <div class="dias-rot">Días de turno</div>
    <div class="dias-val">Miércoles y jueves</div>
    <div class="dias-hora">de 15 a 17.30</div>
  </div>

  <div class="pie">
    <div class="direccion">Cuenca 3526, Villa del Parque, CABA <span>· Tel. 011 4504-7282</span></div>
  </div>
</div>

<script>
  function imprimir(tam) {
    document.body.classList.toggle("a3", tam === "A3");
    document.getElementById("pagesize").textContent = "@page{ size:" + tam + "; margin:0; }";
    window.setTimeout(function () { window.print(); }, 120);
  }
</script>

</body>
</html>
